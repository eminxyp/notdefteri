<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOT DEFTERİ</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: background-color 0.5s;
        }

        h1 {
            color: #3498db;
        }

        textarea {
            width: 80%;
            min-height: 150px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #3498db;
            border-radius: 5px;
            resize: vertical;
            color: #2c3e50;
            transition: background-color 0.5s;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: background-color 0.5s;
        }

        button:hover {
            background-color: #27ae60;
        }

        #notList {
            width: 80%;
            text-align: left;
        }

        #notList li {
            list-style-type: none;
            margin-bottom: 15px;
            padding: 15px;
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            color: #34495e;
            transition: background-color 0.5s;
        }

        #kaydedilenNotlar {
            font-weight: bold;
            margin-top: 20px;
            color: #3498db;
        }

        .silButton {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 10px;
            transition: background-color 0.5s;
        }

        .silButton:hover {
            background-color: #c0392b;
        }

       
        body {
            background-color: #000000;
            color: #ecf0f1;
        }

        body,
        body,
        body #notList li {
            background-color: #00000;
            border-color: #2c3e50;
        }

        body #kaydedilenNotlar {
            color: #3498db;
        }
    </style>
</head>
<body>

    <h1>Not Defteri</h1>
    
    <textarea id="notTextArea" placeholder="Notunuzu buraya yazın..."></textarea>
    
    <button onclick="kaydet()">Kaydet</button>

    <div id="kaydedilenNotlar">Kaydedilen Notlar</div>
    <ul id="notList"></ul>
    
    <script>
        function kaydet() {
            var not = document.getElementById("notTextArea").value;
            if (not.trim() !== "") {
                // Notu tarayıcı hafızasına kaydet
                var savedNotes = localStorage.getItem("savedNotes") || "[]";
                savedNotes = JSON.parse(savedNotes);
                savedNotes.push(not);
                localStorage.setItem("savedNotes", JSON.stringify(savedNotes));

                // Not listesini güncelle
                guncelleNotListesi();
                
                // Kullanıcıya bildirim
                alert("Not kaydedildi:\n\n" + not);
                
                // Textarea'yı temizle
                document.getElementById("notTextArea").value = "";
            } else {
                alert("Lütfen bir not yazın.");
            }
        }

        function guncelleNotListesi() {
            var notListesi = document.getElementById("notList");
            notListesi.innerHTML = "";
            
            var savedNotes = localStorage.getItem("savedNotes") || "[]";
            savedNotes = JSON.parse(savedNotes);

            savedNotes.forEach(function(note, index) {
                var li = document.createElement("li");
                li.innerHTML = "<p>" + note + "</p>";

                var silButton = document.createElement("button");
                silButton.textContent = "Sil";
                silButton.className = "silButton";
                silButton.onclick = function() {
                    // Seçilen notu sil
                    savedNotes.splice(index, 1);
                    localStorage.setItem("savedNotes", JSON.stringify(savedNotes));

                    // Not listesini güncelle
                    guncelleNotListesi();
                };

                li.appendChild(silButton);
                notListesi.appendChild(li);
            });

            // Kaydedilen notlar başlığını güncelle
            var kaydedilenNotlarDiv = document.getElementById("kaydedilenNotlar");
            kaydedilenNotlarDiv.textContent = "Kaydedilen Notlar";
        }

        // Sayfa yüklendiğinde not listesini güncelle
        guncelleNotListesi();

        // Tema değiştirme fonksiyonu
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
